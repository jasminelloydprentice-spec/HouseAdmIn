# Supabase local development configuration for Paperkeep.
project_id = "paperkeep"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed/seed.sql"]

[studio]
enabled = true
port = 54323

# Local email testing: OTP emails are captured here, nothing is sent.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "paperkeep://"
additional_redirect_urls = []
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
otp_length = 6
otp_expiry = 600

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.process-document]
verify_jwt = true

[functions.ask-assistant]
verify_jwt = true

[functions.delete-account]
verify_jwt = true
